<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prime</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png.PNG">
<link rel="icon" type="image/png" href="icon.png.PNG">
<meta name="apple-mobile-web-app-title" content="Prime">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--card:#0c0d0f;--card2:#16171a;--line:#222429;--txt:#fff;--mut:#8e9096;
  /* тёмная палитра */
  --green:#3f9a30;--green-glow:rgba(63,154,48,.45);
  --blue:#2177c9;--orange:#d4711c;--violet:#7046d1;--red:#c43b3b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Nunito',system-ui,sans-serif;font-weight:700}
body{min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;color:inherit}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 120px)}
.eyebrow{font-size:13px;letter-spacing:.22em;color:#c9cacd;text-transform:uppercase;font-weight:800}
h1{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.avatar{width:56px;height:56px;border-radius:50%;background:#26272b center/cover no-repeat;display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--green);border:2px solid #1d1e21;cursor:pointer;flex:none}
.avatar.lg{width:72px;height:72px;font-size:28px}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:26px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0 8px;text-align:center;color:#d4d5d8;position:relative}
.day small{display:block;font-size:10px;letter-spacing:.15em;font-weight:800}
.day b{display:block;font-size:20px;font-weight:900;margin-top:2px}
.day.on{background:#fff;color:#000;border-color:#fff}
.day.has::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}

.ring{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:0 auto 30px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px var(--green-glow))}
.ring .prog{transition:stroke-dashoffset .6s ease}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .eyebrow{font-size:12px}
.big{font-size:clamp(56px,19vw,84px);font-weight:900;line-height:1;margin:10px 0 8px;letter-spacing:-.02em}
.pill{background:var(--green);color:#fff;border-radius:99px;padding:6px 20px;font-weight:900;font-size:16px;margin-top:16px}
.pill.over{background:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;margin-bottom:14px}
.macro{margin-top:20px}
.macro .row{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.1em;font-size:15px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:12px;vertical-align:-2px}
.bar{height:12px;background:#222327;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}

/* diary */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.sum b{display:block;font-size:20px;font-weight:900}
.sum small{font-size:9px;letter-spacing:.15em;color:var(--mut);font-weight:800}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mk{font-weight:900;color:var(--mut);font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item>div:first-child{flex:1;min-width:0}
.in{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im{font-size:12px;color:var(--mut);margin-top:2px;font-weight:700}
.im .p{color:var(--blue)}.im .c{color:var(--orange)}.im .f{color:var(--violet)}
.ik{font-weight:900;font-size:16px}
.x{background:var(--card2);border:0;color:var(--mut);width:30px;height:30px;border-radius:10px;font-size:18px;line-height:1}
.addm{background:none;border:0;color:var(--green);font-weight:900;letter-spacing:.08em;font-size:13px;padding:14px 0 0;text-transform:uppercase}

/* weight */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px}
.tile small{font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:800;text-transform:uppercase}
.tile b{display:block;font-size:24px;font-weight:900;margin-top:4px}
.tile b span{font-size:13px;color:var(--mut);margin-left:2px}
.up{color:var(--orange)!important}.down{color:var(--green)!important}
.chart svg{width:100%;height:auto;display:block;margin-top:14px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:800}
.hrow .d{color:var(--mut);font-size:13px;letter-spacing:.08em}
.hrow .r{display:flex;align-items:center;gap:12px}
.hrow .delta{font-size:13px;width:52px;text-align:right}

/* checkpoints */
.cp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cp .pill{margin-top:0;font-size:12px;padding:5px 14px;letter-spacing:.06em;white-space:nowrap}
.cp-goal{font-size:60px;font-weight:900;line-height:1;margin:16px 0 6px;letter-spacing:-.02em}
.cp-goal span{font-size:20px;color:var(--mut);margin-left:6px}
.cp-by{font-size:13px;color:var(--mut);font-weight:800;letter-spacing:.12em}
.cp-row{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-weight:800;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.cp-row b{color:#fff;font-weight:900}
.cp-n{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.1em}
.prow{display:grid;grid-template-columns:24px 1fr auto 82px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:800}
.prow:last-child{border-bottom:0}
.prow .n,.prow .d{color:var(--mut);font-size:13px;letter-spacing:.08em}
.prow.now .n,.prow.now .d{color:#fff}
.prow .fact{display:block;font-size:11px;color:var(--mut);text-align:right}
.st{font-size:11px;letter-spacing:.1em;font-weight:900;text-align:center;border-radius:99px;padding:6px 0;color:var(--mut);background:var(--card2)}
.st.ok{background:var(--green);color:#fff}.st.bad{background:var(--red);color:#fff}.st.now{background:#fff;color:#000}

/* forms */
label.f{display:block;margin-top:12px}
label.f span{font-size:11px;letter-spacing:.18em;color:var(--mut);font-weight:800;text-transform:uppercase}
input,select{width:100%;margin-top:6px;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:#fff;font:inherit;font-size:17px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-top:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-weight:800;padding:10px 0;border-radius:10px;font-size:13px}
.seg button.on{background:#fff;color:#000}
.btn{display:block;width:100%;margin-top:16px;background:var(--green);color:#fff;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:var(--card2)}
.btn.danger{background:#1e0d0e;color:#e06060}
.hint{font-size:13px;color:var(--mut);margin-top:10px;font-weight:700}
.prof{display:flex;gap:16px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--card2);border:1px solid var(--line);color:#ddd;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-weight:800}
.empty.small{padding:30px 0 10px;font-size:14px}

/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(calc(100% - 24px),456px);background:rgba(16,17,19,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:36px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:10px 6px;z-index:10}
nav button{background:none;border:0;color:#b5b6ba;font-size:10px;letter-spacing:.12em;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--green)}
nav .plus{width:60px;height:60px;border-radius:20px;background:var(--green);color:#fff;justify-self:center;box-shadow:0 0 22px var(--green-glow);display:grid;place-items:center}
nav .plus svg{width:30px;height:30px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transition:transform .3s ease,bottom .2s ease;transform:translate(-50%,105%);width:100%;max-width:480px;background:#0f1012;border-radius:28px 28px 0 0;border:1px solid var(--line);padding:12px 20px calc(env(safe-area-inset-bottom) + 22px);z-index:21;max-height:92dvh;overflow:auto}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:9px;background:#333;margin:0 auto 16px}
.sheet h2{font-size:26px;font-weight:900}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);opacity:0;visibility:hidden;pointer-events:none;background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:900;font-size:14px;transition:transform .3s,opacity .3s,visibility .3s;z-index:30}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.foot{text-align:center;color:#55575c;font-size:12px;margin-top:6px}

/* training */
.ch{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:11px;letter-spacing:.18em;color:var(--mut);font-weight:800;text-transform:uppercase}
.card.hero{border-color:#2a3a27;background:#0c0f0b;padding:24px}
.hname{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.02;margin:16px 0 6px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mut);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pill.sm{margin-top:0;font-size:12px;padding:5px 14px;letter-spacing:.06em;white-space:nowrap}
.xl{margin:16px 0 0;border-top:1px solid var(--line)}
.xrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
.xrow span:first-child{min-width:0;overflow-wrap:anywhere}.xrow .m{color:var(--mut);white-space:nowrap}
.btn.glow{box-shadow:0 0 22px var(--green-glow)}
.btn.off{background:var(--card2);color:#5c5e63}
.card.link{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:12px;color:var(--txt)}
.lt{font-size:16px;font-weight:900;margin-top:6px}
.back{background:none;border:0;color:var(--mut);font-weight:900;font-size:14px;letter-spacing:.08em;display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 6px -4px}
.live{position:sticky;top:0;z-index:5;margin:-8px -20px 14px;padding:calc(env(safe-area-inset-top) + 12px) 20px 14px;background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.lv{display:flex;align-items:center;gap:8px}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.clock{font-size:42px;font-weight:900;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fin{background:#fff;color:#000;border:0;border-radius:99px;padding:12px 18px;font-weight:900;font-size:13px;letter-spacing:.08em;min-height:44px;flex:none}
.pbar{height:8px;background:#222327;border-radius:99px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.card.ex.now{border-color:var(--green);box-shadow:0 0 0 1px rgba(63,154,48,.35)}
.exn{font-size:21px;font-weight:900;overflow-wrap:anywhere}
.exm{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
.bdg{border-radius:99px;padding:5px 12px;font-weight:900;font-size:11px;letter-spacing:.1em;white-space:nowrap;background:var(--card2);color:var(--mut);flex:none}
.bdg.ok{background:var(--green);color:#fff}.bdg.now{background:#fff;color:#000}
.sg{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:8px}
.sg input{margin-top:0;text-align:center;padding:12px 4px;min-width:0}
.sg .n{font-weight:900;font-size:16px;color:var(--mut);text-align:center}
.sg.done input{border-color:#2a3a27;background:#0e130d}
.chk{width:46px;height:46px;border-radius:14px;border:0;background:var(--card2);color:#5c5e63;display:grid;place-items:center}
.chk.on{background:var(--green);color:#fff;box-shadow:0 0 14px var(--green-glow)}
.addset{background:none;border:0;color:var(--green);font-weight:900;letter-spacing:.08em;font-size:13px;padding:12px 0 0;text-transform:uppercase;min-height:44px}
.okc{width:96px;height:96px;border-radius:50%;background:var(--green);margin:4px auto 0;display:grid;place-items:center;box-shadow:0 0 40px var(--green-glow)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 14px}
.tag{background:var(--green);color:#fff;border-radius:99px;padding:5px 10px;font-weight:900;font-size:10px;letter-spacing:.1em;white-space:nowrap;flex:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;min-height:44px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.hbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;text-align:left;font-weight:800}
.hbtn:last-child,.hrow:last-child{border-bottom:0}
.dtg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.dtg button{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-weight:900;font-size:15px}
.dtg button.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 14px var(--green-glow)}
.prg{width:100%;background:none;border:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;min-height:58px;text-align:left}
.prg:last-child{border-bottom:0}
.prg .pl{display:flex;align-items:center;gap:12px;min-width:0}
.pn{display:block;font-size:16px;font-weight:900;overflow-wrap:anywhere}.pm{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.exh{display:flex;gap:10px;align-items:flex-end}
.num{width:30px;height:30px;border-radius:10px;background:var(--card2);color:var(--mut);font-weight:900;font-size:14px;display:grid;place-items:center;margin-bottom:10px;flex:none}
.rm{width:46px;height:50px;border-radius:14px;border:0;background:#1e0d0e;color:#e06060;font-size:24px;flex:none}
.stp{flex:1;background:var(--card2);border-radius:16px;padding:10px 10px 10px 14px;min-width:0}
.stp>div{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:0;background:#222327;color:#fff;font-size:22px;font-weight:900;line-height:1}
.stp b{font-size:24px;font-weight:900}
.addex{width:100%;border:1.5px dashed #2f3136;background:transparent;color:var(--green);border-radius:20px;padding:18px;font-weight:900;font-size:14px;letter-spacing:.1em;min-height:56px}
nav button[data-t="train"]{position:relative}
nav button.lv::before{content:"";position:absolute;top:0;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="eyebrow" id="eyebrow"></div><h1 id="title">Today</h1></div>
    <div class="avatar" id="avatar" onclick="go('settings')"></div>
  </header>
  <div class="days" id="days"></div>
  <main id="main"></main>
</div>

<nav>
  <button data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>TODAY</button>
  <button data-t="diary" onclick="go('diary')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 5c3-1.5 7-1.5 10 1 3-2.5 7-2.5 10-1v14c-3-1.5-7-1.5-10 1-3-2.5-7-2.5-10-1zM12 6v14"/></svg>DIARY</button>
  <button class="plus" onclick="plus()" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="weight" onclick="go('weight')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 10a5 5 0 0 1 8 0M12 10l1.5-2"/></svg>WEIGHT</button>
  <button data-t="train" onclick="go('train')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>TRAIN</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" onmousedown="if(event.target.closest('button'))event.preventDefault()"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden onchange="importData(this)">
<input type="file" id="photoFile" accept="image/*" hidden onchange="setPhoto(this)">

<script>
const KEY='today-app-v1';
const DEF={settings:{name:'',photo:'',kcal:2400,p:150,c:250,f:70,unit:'kg',goalWeight:null,sex:'f',age:28,height:168,activity:1.375,goal:'maintain'},meals:{},weights:{},train:{days:[],prog:{}},sessions:[],active:null};
const MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const DOWF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const LB=2.20462;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s){const D=JSON.parse(JSON.stringify(DEF));return {...D,...s,settings:{...D.settings,...s.settings},meals:s.meals||{},weights:s.weights||{},train:{...D.train,...s.train},sessions:s.sessions||[],active:s.active||null};}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full')}}

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function dkey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parse(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const today=()=>dkey(new Date());
const fmt=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,' ');
const num=(v,d=0)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cv=kg=>S.settings.unit==='lb'?kg*LB:kg;          // kg -> display unit
const toKg=v=>S.settings.unit==='lb'?v/LB:v;            // display unit -> kg
const w1=v=>(Math.round(v*10)/10).toFixed(1);
let S=load(), tab='today', sel=dkey(new Date()), wRange=30, foodMeal=null;
function dateLabel(k){const d=parse(k);return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`}

function totals(k){
  return (S.meals[k]||[]).reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0});
}

/* ---------- render ---------- */
function render(){
  const titles={today:sel===today()?'Today':DOWF[parse(sel).getDay()],diary:'Diary',weight:'Weight',settings:'Settings',train:'Train',progress:'Progress',summary:'Summary',program:'Program'};
  $('#title').textContent=titles[tab];
  $('#eyebrow').textContent=eyebrowFor();
  renderAvatar($('#avatar'));
  const showDays=tab==='today'||tab==='diary';
  $('#days').style.display=showDays?'':'none';
  if(showDays) renderDays();
  $('#main').innerHTML={today:vToday,diary:vDiary,weight:vWeight,settings:vSettings,train:vTrain,progress:vProgress,summary:vSummary,program:vProgram}[tab]();
  const nt={progress:'train',summary:'train'}[tab]||tab;
  document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===nt));
  $('nav [data-t="train"]').classList.toggle('lv',!!S.active);
}
function renderAvatar(el){
  const g=S.settings;
  el.style.backgroundImage=g.photo?`url(${g.photo})`:'';
  el.textContent=g.photo?'':(g.name.trim()[0]||'☺').toUpperCase();
}
function renderDays(){
  const now=new Date();let h='';
  for(let i=6;i>=0;i--){const d=addDays(now,-i),k=dkey(d);
    h+=`<button class="day${k===sel?' on':''}${(S.meals[k]||[]).length?' has':''}" onclick="pick('${k}')"><small>${DOW[d.getDay()]}</small><b>${d.getDate()}</b></button>`;
  }
  $('#days').innerHTML=h;
}
function go(t){if(t==='settings'&&!['settings','program'].includes(tab))prevTab=tab;tab=t;render();scrollTo({top:0})}
function pick(k){sel=k;render()}

function vToday(){
  const t=totals(sel),g=S.settings,R=88,C=2*Math.PI*R,pct=Math.min(t.kcal/g.kcal,1),left=g.kcal-t.kcal;

      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" opacity="${t.kcal>0?1:0}"/></svg>

      <div class="eyebrow">of ${fmt(g.kcal)} kcal</div>

function macro(n,v,goal,col){

/* ---------- weight plan (checkpoints) ---------- */
const PLAN=[['2026-11-26',87.5],['2026-12-03',86.7],['2026-12-10',85.9],['2026-12-17',85.1],['2026-12-24',84.3],['2026-12-31',83.5],['2027-01-07',82.7],['2027-01-14',81.9],['2027-01-21',81.1],['2027-01-28',80.3],['2027-02-04',79.5],['2027-02-11',78.7],['2027-02-18',78.0]];
// weight on the checkpoint day, or the latest one in the 6 days before it
function cpWeight(k){
  if(S.weights[k]!=null) return S.weights[k];
  const lo=dkey(addDays(parse(k),-6)),ks=Object.keys(S.weights).filter(x=>x>=lo&&x<=k).sort();
  return ks.length?S.weights[ks.at(-1)]:null;
}
// result opens the day after the checkpoint
function cpStatus(i){
  const[k,kg]=PLAN[i];if(today()<=k) return null;
  const w=cpWeight(k);if(w==null) return 'none';
  return Math.round(w*10)<=Math.round(kg*10)?'ok':'bad';
}
function vPlan(){
  const t=today(),u=S.settings.unit,ks=Object.keys(S.weights).sort(),cur=ks.length?S.weights[ks.at(-1)]:null;
  const ai=PLAN.findIndex(([k])=>k>=t),fin=PLAN.at(-1),passed=PLAN.filter((_,i)=>cpStatus(i)==='ok').length;
  let top;
  if(ai<0){
    top=`<div class="card cp"><div class="eyebrow">Plan complete</div>
      <div class="cp-goal">${w1(cv(fin[1]))}<span>${u}</span></div>
      <div class="cp-by">${passed} OF ${PLAN.length} CHECKPOINTS PASSED</div></div>`;
  }else{
    const[k,kg]=PLAN[ai],days=Math.round((parse(k)-parse(t))/864e5),left=cur==null?null:cv(cur)-cv(kg);
    top=`<div class="card cp">
      <div class="cp-top"><span class="eyebrow">Checkpoint ${ai+1} of ${PLAN.length}</span>
        <span class="pill">${days===0?'TODAY':days===1?'1 DAY LEFT':days+' DAYS LEFT'}</span></div>
      <div class="cp-goal">${w1(cv(kg))}<span>${u}</span></div>
      <div class="cp-by">BY ${dateLabel(k)}</div>
      <div class="cp-row"><span>Now <b>${cur==null?'—':w1(cv(cur))+' '+u}</b></span><span>${left==null?'':left>0.05?'<b>'+w1(left)+' '+u+'</b> to go':'<b>On target</b>'}</span></div>
      <div class="cp-row"><span>Final goal</span><span><b>${w1(cv(fin[1]))} ${u}</b> · ${dateLabel(fin[0])}</span></div>
    </div>`;
  }
  const rows=PLAN.map(([k,kg],i)=>{
    const s=cpStatus(i),d=parse(k),w=s==='ok'||s==='bad'?cpWeight(k):null;
    const lab=s==='ok'?'PASSED':s==='bad'?'MISSED':s==='none'?'NO DATA':i===ai?'NOW':'—';
    const cls=s==='ok'?'ok':s==='bad'?'bad':i===ai?'now':'';
    return `<div class="prow${i===ai?' now':''}"><span class="n">${i+1}</span><span class="d">${MON[d.getMonth()]} ${d.getDate()}</span>
      <span>${w1(cv(kg))} ${u}${w!=null?`<span class="fact">${w1(cv(w))}</span>`:''}</span><span class="st ${cls}">${lab}</span></div>`;
  }).join('');
  const list=`<div class="card"><div class="mh"><span class="eyebrow">Plan</span><span class="cp-n">${passed}/${PLAN.length} PASSED</span></div>${rows}</div>`;
  return {top,list};
}

function vWeight(){
  const ks=Object.keys(S.weights).sort(),u=S.settings.unit;
  if(!ks.length) return vPlan().top+`<div class="card empty">No weight logged yet<br>Tap + to add your weight</div>`;
  const cur=S.weights[ks.at(-1)];
  const cutoff=wRange?dkey(addDays(new Date(),-wRange+1)):'';
  const pts=ks.filter(k=>k>=cutoff);
  const first=pts.length?S.weights[pts[0]]:cur, diff=cv(cur)-cv(first);
  const gw=S.settings.goalWeight||PLAN.at(-1)[1], toGo=gw?cv(cur)-cv(gw):null;
  const rng=[[7,'7D'],[30,'30D'],[90,'90D'],[0,'ALL']];
  let hist='';const rev=[...ks].reverse().slice(0,60);
  rev.forEach((k,i)=>{const prev=rev[i+1],d=prev?cv(S.weights[k])-cv(S.weights[prev]):null;
    hist+=`<div class="hrow"><span class="d">${dateLabel(k)}</span><span class="r">
      <span class="delta ${d>0?'up':d<0?'down':''}">${d==null||Math.abs(d)<.05?'':(d>0?'+':'')+w1(d)}</span>
      <span>${w1(cv(S.weights[k]))} ${u}</span><button class="x" onclick="delWeight('${k}')">×</button></span></div>`});
  const P=vPlan();
  return P.top+`<div class="tiles">
    <div class="tile"><small>Current</small><b>${w1(cv(cur))}<span>${u}</span></b></div>
    <div class="tile"><small>${wRange?wRange+' days':'Total'}</small><b class="${diff>0?'up':diff<0?'down':''}">${diff>0?'+':''}${w1(diff)}</b></div>
    <div class="tile"><small>To goal</small><b>${toGo==null?'—':w1(Math.abs(toGo))}${toGo==null?'':'<span>'+u+'</span>'}</b></div>
  </div>
  <div class="card chart"><div class="mh"><span class="eyebrow">Trend</span></div>
    <div class="seg">${rng.map(([v,l])=>`<button class="${wRange===v?'on':''}" onclick="wRange=${v};render()">${l}</button>`).join('')}</div>
    ${chart(pts)}
  </div>
  ${P.list}
  <div class="card"><div class="eyebrow">History</div>${hist}</div>`;
}
function chart(pts){
  if(pts.length<2) return `<div class="empty small">Log at least 2 days to see the trend</div>`;
  const W=320,H=170,PX=8,PT=14,PB=22;
  const vals=pts.map(k=>cv(S.weights[k]));
  const gw=cv(S.settings.goalWeight||PLAN.at(-1)[1]);
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx-mn<1){mn-=.5;mx+=.5} const p=(mx-mn)*.15;mn-=p;mx+=p;
  const t0=parse(pts[0]).getTime(),span=(parse(pts.at(-1)).getTime()-t0)||1;
  const X=k=>PX+(parse(k).getTime()-t0)/span*(W-2*PX);
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const xy=pts.map((k,i)=>[X(k),Y(vals[i])].map(n=>n.toFixed(1)));
  const line=xy.map(q=>q.join(',')).join(' ');
  const area=`M${xy[0][0]},${H-PB} L${line.split(' ').join(' L')} L${xy.at(-1)[0]},${H-PB} Z`;
  const last=xy.at(-1);
  let grid='';for(let i=0;i<3;i++){const v=mn+(mx-mn)*(i+.5)/3,y=Y(v);
    grid+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1f2024" stroke-dasharray="3 5"/><text x="${W}" y="${y-4}" text-anchor="end" fill="#5c5e63" font-size="10" font-weight="800">${w1(v)}</text>`}
  const goal=gw!=null&&gw>mn&&gw<mx?`<line x1="0" x2="${W}" y1="${Y(gw)}" y2="${Y(gw)}" stroke="var(--blue)" stroke-dasharray="6 4"/><text x="4" y="${Y(gw)-5}" fill="var(--blue)" font-size="10" font-weight="900">GOAL</text>`:'';
  const d0=parse(pts[0]),d1=parse(pts.at(-1));
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Nunito,system-ui,sans-serif">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--green)" stop-opacity=".35"/><stop offset="1" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${goal}<path d="${area}" fill="url(#wg)"/>
    <polyline points="${line}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--green)" stroke="#000" stroke-width="2"/>
    <text x="${PX}" y="${H-4}" fill="#5c5e63" font-size="10" font-weight="800">${MON[d0.getMonth()]} ${d0.getDate()}</text>
    <text x="${W-PX}" y="${H-4}" text-anchor="end" fill="#5c5e63" font-size="10" font-weight="800">${MON[d1.getMonth()]} ${d1.getDate()}</text>
  </svg>`;
}

/* ---------- training ---------- */
const DOWS=[1,2,3,4,5,6,0],DS=['M','T','W','T','F','S','S'];
const CHEV='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8e9096" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="flex:none"><path d="m9 6 6 6-6 6"/></svg>';
const CHK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
let prevTab='today',progDay=1,sumId=null,sumFrom='train',progEx=null,pRange=90;
const T=()=>S.train;
const kgs=v=>String(Math.round(num(v)*100)/100);
const kgL=v=>num(v)?kgs(v)+' kg':'BW';
function dur(ms,live){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=s%60;
  return live?`${pad(h)}:${pad(m)}:${pad(x)}`:h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`}
function backBtn(t,l){return `<button class="back" onclick="go('${t}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>${l.toUpperCase()}</button>`}
function eyebrowFor(){
  if(tab==='settings') return 'Preferences';
  if(tab==='program') return DOWF[progDay];
  if(tab==='summary'){const s=S.sessions.find(x=>x.id===sumId);return dateLabel(s?s.date:today())}
  return dateLabel(tab==='today'||tab==='diary'?sel:today());
}
function pName(d){const p=T().prog[d];return (p&&p.name&&p.name.trim())||DOWF[d]+' workout'}
function exList(d){const p=T().prog[d];return p?p.ex.filter(e=>e.name&&e.name.trim()):[]}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);return addDays(d,-((d.getDay()+6)%7))}
function exVol(e){return e.sets.reduce((a,s)=>a+(s.done?num(s.kg)*num(s.reps):0),0)}
function sesVol(s){return s.ex.reduce((a,e)=>a+exVol(e),0)}
function sesSets(s){return s.ex.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0)}
function bestOf(e){let b=null;for(const s of e.sets)if(s.done&&(!b||num(s.kg)>num(b.kg)||(num(s.kg)===num(b.kg)&&num(s.reps)>num(b.reps))))b=s;return b}
const nk=n=>String(n).trim().toLowerCase();
function lastFor(name,skipId){for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];if(s.id===skipId)continue;
  const e=s.ex.find(x=>nk(x.name)===nk(name));if(e&&e.sets.some(x=>x.done))return e}return null}
function prevMax(name,idx){let m=null;for(let i=0;i<idx;i++){const e=S.sessions[i].ex.find(x=>nk(x.name)===nk(name));
  if(e)for(const s of e.sets)if(s.done&&(m==null||num(s.kg)>m))m=num(s.kg)}return m}

function vTrain(){
  if(S.active) return vSession();
  const now=new Date(),dow=now.getDay(),days=T().days,ws=weekStart(),tk=today();
  let wk='';for(let i=0;i<7;i++){const d=addDays(ws,i),k=dkey(d);
    wk+=`<div class="day${k===tk?' on':''}${days.includes(d.getDay())?' has':''}"><small>${DOW[d.getDay()]}</small><b>${d.getDate()}</b></div>`}
  let hero;
  if(!days.length){
    hero=`<div class="card hero"><span class="eyebrow" style="color:var(--green)">Get started</span><div class="hname">Plan your week</div>
      <div class="sub">Pick your training days and programs</div><button class="btn glow" onclick="go('settings')">Set up training</button></div>`;
  }else if(days.includes(dow)){
    const ex=exList(dow),done=S.sessions.filter(s=>s.date===tk);
    if(done.length){const s=done.at(-1);
      hero=`<div class="card hero"><div class="ch"><span class="eyebrow" style="color:var(--green)">Done today</span><span class="pill sm">${dur(s.end-s.start)}</span></div>
        <div class="hname">${esc(s.name)}</div><div class="sub">${sesSets(s)} sets · ${fmt(sesVol(s))} kg lifted</div>
        <button class="btn glow" onclick="openSummary('${s.id}')">View summary</button>
        <button class="btn ghost" style="margin-top:10px" onclick="startSession()">Start another session</button></div>`;
    }else if(!ex.length){
      hero=`<div class="card hero"><span class="eyebrow" style="color:var(--green)">Today · ${DOWF[dow]}</span><div class="hname">${esc(pName(dow))}</div>
        <div class="sub">No exercises yet</div><button class="btn glow" onclick="openProgram(${dow})">Add exercises</button></div>`;
    }else{
      const sets=ex.reduce((a,e)=>a+e.sets,0),ls=[...S.sessions].reverse().find(s=>nk(s.name)===nk(pName(dow)));
      hero=`<div class="card hero"><div class="ch"><span class="eyebrow" style="color:var(--green)">Today&#39;s session</span><span class="pill sm">${ex.length} EXERCISE${ex.length>1?'S':''}</span></div>

function vSession(){
  const a=S.active,tot=a.ex.reduce((x,e)=>x+e.sets.length,0),dn=sesSets(a);
  const exDone=a.ex.filter(e=>e.sets.length&&e.sets.every(s=>s.done)).length;

        <input type="text" inputmode="numeric" autocomplete="off" aria-label="Set ${si+1} reps" value="${esc(s.reps)}" placeholder="${esc(ph.reps)}" oninput="setSet(${ei},${si},'reps',this.value)">
        <button class="chk${s.done?' on':''}" aria-label="Set ${si+1} done" aria-pressed="${!!s.done}" onclick="toggleSet(${ei},${si})">${CHK}</button></div>`}).join('')}
      <div class="ch"><button class="addset" onclick="addSet(${ei})">+ Add set</button>${e.sets.length>1&&!e.sets.at(-1).done?`<button class="addset" style="color:var(--mut)" onclick="rmSet(${ei})">− Remove set</button>`:''}</div></div>`;
  });
  return h+`<button class="btn glow" onclick="finishSession()">Finish session</button>
    <button class="btn ghost" style="margin-top:10px" onclick="cancelSession()">Cancel session</button>`;
}
function phOf(e,si,last){
  let kg='';for(let j=si-1;j>=0;j--)if(e.sets[j].kg!==''){kg=e.sets[j].kg;break}
  if(kg===''&&last){const ls=last.sets.filter(x=>x.done),x=ls[si]||ls.at(-1);if(x)kg=kgs(x.kg)}
  return {kg,reps:String(e.plan.reps)};
}
function setSet(ei,si,k,v){const s=S.active&&S.active.ex[ei]&&S.active.ex[ei].sets[si];if(!s)return;s[k]=v.trim().replace(',','.');save()}
function toggleSet(ei,si){
  const e=S.active.ex[ei],s=e.sets[si];
  if(s.done){s.done=false}
  else{const ph=phOf(e,si,lastFor(e.name,S.active.id)),kg=s.kg!==''?s.kg:ph.kg,reps=s.reps!==''?s.reps:ph.reps;
    if(!(num(reps)>0)) return toast('Enter reps');
    if(num(kg)<0||num(kg)>1000) return toast('Check the weight');
    s.kg=kg===''?'0':kgs(kg);s.reps=String(Math.round(num(reps)));s.done=true;
    try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}}
  save();render();
}
function addSet(ei){S.active.ex[ei].sets.push({kg:'',reps:'',done:false});save();render()}
function rmSet(ei){const st=S.active.ex[ei].sets;if(st.length>1&&!st.at(-1).done){st.pop();save();render()}}

function finishSession(){

function exStats(){

function pchart(pts){
  if(pts.length<2) return `<div class="empty small">Log this exercise in 2 sessions to see the trend</div>`;
  const W=320,H=170,PX=8,PT=14,PB=22,vals=pts.map(p=>p.kg);
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<2){mn-=1;mx+=1}const p=(mx-mn)*.15;mn-=p;mx+=p;
  const t0=parse(pts[0].d).getTime(),span=(parse(pts.at(-1).d).getTime()-t0)||1;
  const X=(q,i)=>span>1?PX+(parse(q.d).getTime()-t0)/span*(W-2*PX):PX+i/(pts.length-1)*(W-2*PX);
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const xy=pts.map((q,i)=>[X(q,i),Y(q.kg)].map(n=>n.toFixed(1))),line=xy.map(q=>q.join(',')).join(' ');
  const area=`M${xy[0][0]},${H-PB} L${line.split(' ').join(' L')} L${xy.at(-1)[0]},${H-PB} Z`,last=xy.at(-1);
  let grid='';for(let i=0;i<3;i++){const v=mn+(mx-mn)*(i+.5)/3,y=Y(v);
    grid+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1f2024" stroke-dasharray="3 5"/><text x="${W}" y="${y-4}" text-anchor="end" fill="#5c5e63" font-size="10" font-weight="800">${w1(v)}</text>`}
  const d0=parse(pts[0].d),d1=parse(pts.at(-1).d);
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Nunito,system-ui,sans-serif">
    <defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--green)" stop-opacity=".35"/><stop offset="1" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#pg)"/>
    <polyline points="${line}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--green)" stroke="#000" stroke-width="2"/>
    <text x="${PX}" y="${H-4}" fill="#5c5e63" font-size="10" font-weight="800">${MON[d0.getMonth()]} ${d0.getDate()}</text>
    <text x="${W-PX}" y="${H-4}" text-anchor="end" fill="#5c5e63" font-size="10" font-weight="800">${MON[d1.getMonth()]} ${d1.getDate()}</text></svg>`;
}

function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.meals||!d.weights)throw 0;
    localStorage.setItem(KEY,JSON.stringify(d));S=load();save();render();toast('Backup restored')}catch(e){toast('Not a valid backup')}inp.value=''};
  r.readAsText(f);
}
function resetAll(){if(confirm('Delete all meals, weights, workouts and settings?')){localStorage.removeItem(KEY);S=load();render();toast('All data deleted')}}
function setPhoto(inp){
  const f=inp.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{const s=160,cv2=document.createElement('canvas');cv2.width=cv2.height=s;const x=cv2.getContext('2d');
    const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    URL.revokeObjectURL(img.src);setS('photo',cv2.toDataURL('image/jpeg',.85),true);inp.value=''};
  img.src=URL.createObjectURL(f);
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

const _render=render;render=function(){_render();afterSettings()};
render();

/* keep the sheet above the iPhone keyboard */
if(window.visualViewport){
  const fit=()=>{const vv=visualViewport,lh=document.documentElement.clientHeight;
    $('#sheet').style.bottom=Math.max(0,lh-vv.height-vv.offsetTop)+'px'};
  visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);
}

/* new day: jump to today */
let lastDay=today();
function dayCheck(){const t=today();if(t!==lastDay){if(sel===lastDay)sel=t;lastDay=t;render()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')dayCheck()});
setInterval(dayCheck,60000);

setInterval(()=>{const el=document.getElementById('sTimer');if(el&&S.active)el.textContent=dur(Date.now()-S.active.start,1)},1000);

if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
